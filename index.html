<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey Daph! 🎟️✨</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Plus Jakarta Sans',sans-serif;
}

body{
overflow-x:hidden;
overflow-y:auto;
background:radial-gradient(circle at 50% 20%, #153e2d 0%, #0a2318 50%, #04110b 100%);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
position:relative;
}

/* Glitter Particles */
.star{
position:absolute;
width:3px;
height:3px;
background:#86efac;
border-radius:50%;
box-shadow:0 0 8px #4ade80;
animation:twinkle 2.5s infinite alternate ease-in-out;
pointer-events:none;
}

@keyframes twinkle{
0%{opacity:0.2; transform:scale(0.5);}
50%{opacity:1; transform:scale(1.5);}
100%{opacity:0.3; transform:scale(0.8);}
}

/* Ambient Music Icons */
.float-icon{
position:absolute;
bottom:-80px;
color:rgba(134,239,172,0.25);
font-size:20px;
animation:floatUp linear infinite;
pointer-events:none;
}

@keyframes floatUp{
0%{transform:translateY(0) rotate(0deg); opacity:0;}
20%{opacity:0.6;}
80%{opacity:0.6;}
100%{transform:translateY(-120vh) rotate(360deg); opacity:0;}
}

/* Intro Box */
#intro-box{
cursor:pointer;
text-align:center;
z-index:2;
transition:all 0.3s ease;
}

.ticket-icon{
font-size:75px;
filter:drop-shadow(0 15px 25px rgba(0,0,0,0.5));
animation:softBounce 2s infinite ease-in-out;
display:inline-block;
}

@keyframes softBounce{
0%, 100%{transform:translateY(0);}
50%{transform:translateY(-10px);}
}

.open-btn{
margin-top:18px;
color:#dcfce7;
font-size:clamp(15px, 3.5vw, 18px);
font-weight:600;
background:rgba(255,255,255,0.08);
padding:12px 28px;
border-radius:30px;
border:1px solid rgba(134,239,172,0.3);
backdrop-filter:blur(10px);
box-shadow:0 10px 25px rgba(0,0,0,0.3);
display:inline-block;
transition:0.3s;
}

.open-btn:hover{
background:rgba(134,239,172,0.2);
transform:scale(1.05);
}

/* Main Ticket Card */
#card{
display:none;
width:100%;
max-width:540px;
padding:clamp(28px, 5vw, 36px);
border-radius:24px;
background:rgba(20, 56, 38, 0.45);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
border:1px solid rgba(134,239,172,0.35);
box-shadow:0 25px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(74,222,128,0.08);
animation:cardAppear 0.8s ease forwards;
z-index:2;
margin:20px 0;
text-align:center;
}

@keyframes cardAppear{
from{opacity:0; transform:scale(0.9) translateY(20px);}
to{opacity:1; transform:scale(1) translateY(0);}
}

.badge{
display:inline-block;
padding:6px 14px;
background:rgba(74,222,128,0.15);
border:1px solid rgba(74,222,128,0.4);
border-radius:20px;
color:#86efac;
font-size:12px;
font-weight:700;
letter-spacing:2px;
text-transform:uppercase;
margin-bottom:12px;
}

h1{
font-family:'Outfit',sans-serif;
font-size:clamp(32px, 7vw, 44px);
color:#f0fdf4;
font-weight:700;
line-height:1.2;
}

/* Event Details Container */
.details-box{
margin:22px 0;
padding:18px 20px;
border-radius:16px;
background:rgba(4, 17, 11, 0.6);
border:1px dashed rgba(134,239,172,0.35);
text-align:left;
color:#dcfce7;
font-size:clamp(14px, 3.2vw, 15px);
line-height:1.7;
}

.details-row{
display:flex;
align-items:center;
margin-bottom:8px;
}

.details-row:last-child{
margin-bottom:0;
}

.details-row span{
margin-right:10px;
font-size:18px;
}

.casual-msg{
color:#e2e8f0;
line-height:1.7;
font-size:clamp(14px, 3.2vw, 15px);
margin:16px 0 24px 0;
}

/* Button Container */
.actions{
display:flex;
gap:15px;
justify-content:center;
align-items:center;
flex-wrap:wrap;
min-height:80px;
position:relative;
}

.btn-yes{
padding:13px 26px;
border:none;
border-radius:50px;
font-size:16px;
font-weight:700;
background:linear-gradient(135deg, #4ade80, #22c55e);
color:#052e16;
cursor:pointer;
transition:transform 0.25s ease, box-shadow 0.25s ease, font-size 0.25s ease, padding 0.25s ease;
box-shadow:0 8px 20px rgba(34,197,94,0.3);
z-index:10;
transform-origin:center center;
}

.btn-yes:hover{
box-shadow:0 10px 25px rgba(34,197,94,0.5);
}

.btn-no{
padding:13px 22px;
border:1px solid rgba(255,255,255,0.25);
border-radius:50px;
font-size:15px;
font-weight:500;
background:rgba(255,255,255,0.06);
color:#cbd5e1;
cursor:pointer;
transition:all 0.2s ease;
}

.btn-no:hover{
background:rgba(255,255,255,0.12);
}

.fade-out{
animation:fadeOut 0.5s forwards;
}

@keyframes fadeOut{
to{opacity:0; transform:scale(0.8);}
}

/* Floating emojis on click */
.burst{
position:absolute;
animation:burstRise 3.5s linear forwards;
pointer-events:none;
z-index:99;
}

@keyframes burstRise{
0%{transform:translateY(0) scale(0.6); opacity:0;}
20%{opacity:1;}
80%{opacity:0.9;}
100%{transform:translateY(-110vh) scale(1.2); opacity:0;}
}

#response-msg{
display:none;
margin-top:20px;
font-size:16px;
color:#86efac;
font-weight:600;
background:rgba(74,222,128,0.1);
padding:14px;
border-radius:14px;
border:1px solid rgba(74,222,128,0.25);
line-height:1.6;
}
</style>
</head>

<body>

<!-- Initial State -->
<div id="intro-box">
<div class="ticket-icon">🎟️</div>
<br>
<div class="open-btn">Hey Daph 🌿 — Tap to open</div>
</div>

<!-- Main Pass Details -->
<div id="card">
<div class="badge">FIRST STOP: DINNER 🎟️</div>
<h1>Hey Daph! 🌿</h1>

<div class="details-box">
<div class="details-row"><span>📅</span> <strong>Date:</strong>&nbsp;Sunday, October 4, 2026</div>
<div class="details-row"><span>🍽️</span> <strong>Plan:</strong>&nbsp;Early Dinner</div>
<div class="details-row"><span></span> <strong>Event: 8pm</strong>&nbsp;Over October Concert</div>
</div>

<div class="casual-msg">
 Since we're heading to the concert, would you like to grab an early dinner first before show starts?🍕✨
<br><br>
Are you down?
</div>

<div class="actions" id="button-group">
<button class="btn-yes" id="yesBtn" onclick="sayYes()">
🟢 Yes, game!
</button>
<button class="btn-no" id="noBtn" onclick="handleNo()">
No 🤔
</button>
</div>

<div id="response-msg"></div>
</div>

<script>
// Sparkles & Glitters
for(let i=0; i<120; i++){
let star = document.createElement("div");
star.className = "star";
star.style.left = Math.random() * 100 + "vw";
star.style.top = Math.random() * 100 + "vh";
star.style.animationDelay = (Math.random() * 2.5) + "s";
document.body.appendChild(star);
}

// Background Floating Emojis
const icons = ["🎵", "✨", "🍕", "🎟️", "🌿"];
for(let i=0; i<14; i++){
let elem = document.createElement("div");
elem.className = "float-icon";
elem.innerText = icons[Math.floor(Math.random() * icons.length)];
elem.style.left = Math.random() * 100 + "vw";
elem.style.animationDuration = (8 + Math.random() * 6) + "s";
elem.style.animationDelay = (Math.random() * 5) + "s";
document.body.appendChild(elem);
}

// Open Pass Animation
document.getElementById("intro-box").onclick = function(){
this.classList.add("fade-out");
setTimeout(()=>{
this.style.display = "none";
document.getElementById("card").style.display = "block";
}, 400);
}

// No Button Click Trick (Grows the Yes Button)
let scale = 1;
const noTexts = [
"No 🤔",
"Sure na ikaw? 👀",
"Weh, baka nagkamali ka lang ng button😅",
"Nasa other side lang yess button 🍕",
"Sagot ko na dessert! 🍰",
"And matcha na rin! 😜",
"Bawal mag-No! 🛑",
"No choice po, yes lang HAHAHHAA 🟢"
];
let textIndex = 0;

function handleNo(){
scale += 0.35;
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");

yesBtn.style.transform = `scale(${scale})`;

textIndex = (textIndex + 1) % noTexts.length;
noBtn.innerText = noTexts[textIndex];

// If Yes grows too large, hide the No button completely
if(scale >= 3.2){
noBtn.style.display = "none";
}
}

// Yes Confirmation
function sayYes(){
document.getElementById("button-group").style.display = "none";
let res = document.getElementById("response-msg");
res.style.display = "block";
res.innerHTML = "Ayun oh! 🎉 See you on Oct 4 po! 🎟️✨";

const emojis = ["✨", "🎵", "🍕", "🟢", "🎟️", "🙌"];
for(let i=0; i<70; i++){
let item = document.createElement("div");
item.className = "burst";
item.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
item.style.left = Math.random() * 100 + "vw";
item.style.bottom = "-20px";
item.style.fontSize = (16 + Math.random() * 24) + "px";
item.style.animationDuration = (2.5 + Math.random() * 2) + "s";
document.body.appendChild(item);

setTimeout(()=>{
item.remove();
}, 4500);
}
}
</script>

</body>
</html>
